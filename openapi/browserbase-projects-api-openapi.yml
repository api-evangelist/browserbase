openapi: 3.2.0
info:
  title: Browserbase Projects API
  description: Browserbase API for 3rd party developers
  version: v1
servers:
- url: https://api.browserbase.com
  description: Public endpoint
  variables: {}
security:
- BrowserbaseAuth: []
tags:
- name: Projects
paths:
  /v1/projects:
    get:
      operationId: Projects_list
      summary: List Projects
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
      tags:
      - Projects
  /v1/projects/{id}:
    get:
      operationId: Projects_get
      summary: Get a Project
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      tags:
      - Projects
  /v1/projects/{id}/usage:
    get:
      operationId: Projects_usage
      summary: Get Project Usage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUsage'
      tags:
      - Projects
components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
        ownerId:
          type: string
        defaultTimeout:
          type: integer
          maximum: 21600
          minimum: 60
        concurrency:
          description: The maximum number of sessions that this project can run concurrently.
          type: integer
          minimum: 1
      required:
      - id
      - createdAt
      - updatedAt
      - name
      - ownerId
      - defaultTimeout
      - concurrency
    ProjectUsage:
      type: object
      properties:
        browserMinutes:
          type: integer
          minimum: 0
        proxyBytes:
          type: integer
          minimum: 0
      required:
      - browserMinutes
      - proxyBytes
  securitySchemes:
    BrowserbaseAuth:
      type: apiKey
      in: header
      name: X-BB-API-Key
      description: Your [Browserbase API Key](https://www.browserbase.com/settings).
