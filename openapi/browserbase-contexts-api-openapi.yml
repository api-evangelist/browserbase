openapi: 3.2.0
info:
  title: Browserbase Contexts API
  description: Browserbase API for 3rd party developers
  version: v1
servers:
- url: https://api.browserbase.com
  description: Public endpoint
  variables: {}
security:
- BrowserbaseAuth: []
tags:
- name: Contexts
paths:
  /v1/contexts:
    post:
      operationId: Contexts_create
      summary: Create a Context
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  description: The Project ID. Can be found in [Settings](https://www.browserbase.com/settings). Optional - if not provided, the project will be inferred from the API key.
                  type: string
                name:
                  description: Optional user-defined name for the Context. Leading and trailing whitespace is trimmed before storage. Names are unique within the project among active Contexts, compared case-insensitively.
                  type: string
                  maxLength: 128
                  minLength: 1
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  publicKey:
                    description: The public key to encrypt the user-data-directory.
                    type: string
                  cipherAlgorithm:
                    description: The cipher algorithm used to encrypt the user-data-directory. AES-256-CBC is currently the only supported algorithm.
                    type: string
                  initializationVectorSize:
                    description: The initialization vector size used to encrypt the user-data-directory. [Read more about how to use it](/features/contexts).
                    type: integer
                    format: uint8
                required:
                - id
                - publicKey
                - cipherAlgorithm
                - initializationVectorSize
      tags:
      - Contexts
  /v1/contexts/{id}:
    get:
      operationId: Contexts_get
      summary: Get a Context
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Context'
      tags:
      - Contexts
    delete:
      operationId: Contexts_delete
      summary: Delete a Context
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
      tags:
      - Contexts
components:
  schemas:
    Context:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projectId:
          description: The Project ID linked to the uploaded Context.
          type: string
        name:
          description: Optional user-defined name for the Context. Leading and trailing whitespace is trimmed before storage. Names are unique within the project among active Contexts, compared case-insensitively.
          type: string
          maxLength: 128
          minLength: 1
      required:
      - id
      - createdAt
      - updatedAt
      - projectId
  securitySchemes:
    BrowserbaseAuth:
      type: apiKey
      in: header
      name: X-BB-API-Key
      description: Your [Browserbase API Key](https://www.browserbase.com/settings).
x-provenance:
  method: harvested
  publisher: Browserbase
  source: https://docs.browserbase.com/reference/api/openapi.v1.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
