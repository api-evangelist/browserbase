openapi: 3.2.0
info:
  title: Browserbase Sessions API
  description: Browserbase API for 3rd party developers
  version: v1
servers:
- url: https://api.browserbase.com
  description: Public endpoint
  variables: {}
security:
- BrowserbaseAuth: []
tags:
- name: Sessions
paths:
  /v1/sessions:
    get:
      operationId: Sessions_list
      summary: List Sessions
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - RUNNING
          - ERROR
          - TIMED_OUT
          - COMPLETED
      - name: q
        in: query
        description: Query sessions by user metadata. See [Querying Sessions by User Metadata](/features/sessions#querying-sessions-by-user-metadata) for the schema of this query.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
      tags:
      - Sessions
    post:
      operationId: Sessions_create
      summary: Create a Session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  description: The Project ID. Can be found in [Settings](https://www.browserbase.com/settings). Optional - if not provided, the project will be inferred from the API key.
                  type: string
                extensionId:
                  description: The uploaded Extension ID. See [Upload Extension](/reference/api/upload-an-extension).
                  type: string
                browserSettings:
                  type: object
                  properties:
                    context:
                      type: object
                      properties:
                        id:
                          description: The Context ID.
                          type: string
                        persist:
                          description: Whether or not to persist the context after browsing. Defaults to `false`.
                          type: boolean
                      required:
                      - id
                    extensionId:
                      description: The uploaded Extension ID. See [Upload Extension](/reference/api/upload-an-extension).
                      type: string
                    viewport:
                      type: object
                      properties:
                        width:
                          description: The width of the browser.
                          type: integer
                        height:
                          description: The height of the browser.
                          type: integer
                    blockAds:
                      description: Enable or disable ad blocking in the browser. Defaults to `false`.
                      type: boolean
                    solveCaptchas:
                      description: Enable or disable captcha solving in the browser. Defaults to `true`.
                      type: boolean
                    recordSession:
                      description: Enable or disable session recording. Defaults to `true`.
                      type: boolean
                    logSession:
                      description: Enable or disable session logging. Defaults to `true`.
                      type: boolean
                    advancedStealth:
                      description: 'Advanced Browser Stealth Mode. Deprecated: use `verified` instead.'
                      type: boolean
                      deprecated: true
                    verified:
                      description: Verified Browser Mode
                      type: boolean
                    captchaImageSelector:
                      description: Custom selector for captcha image. See [Custom Captcha Solving](/features/stealth-mode#custom-captcha-solving)
                      type: string
                    captchaInputSelector:
                      description: Custom selector for captcha input. See [Custom Captcha Solving](/features/stealth-mode#custom-captcha-solving)
                      type: string
                    os:
                      description: 'Operating system for stealth mode. Valid values: windows, mac, linux, mobile, tablet'
                      type: string
                      enum:
                      - windows
                      - mac
                      - linux
                      - mobile
                      - tablet
                    allowedDomains:
                      description: An optional list of allowed domains for the session. If you pass one or more domains, Browserbase restricts top-level (main-frame) page navigations to the listed domains and their subdomains. For example, `example.com` also permits `www.example.com` and `a.b.example.com`, but not `notexample.com`. Matching is domain-based, not full-URL. An empty list (the default) disables the restriction entirely. Browserbase enforces only main-frame navigations; it does not block iframe/subframe loads or other in-page resource requests (images, scripts, XHR, etc.).
                      type: array
                      items:
                        type: string
                      default: []
                    ignoreCertificateErrors:
                      description: Enable or disable ignoring of certificate errors in the browser. Defaults to `false`, so TLS certificate validation is enforced; set to `true` to ignore certificate errors (for example, to reach hosts with expired or self-signed certificates).
                      type: boolean
                timeout:
                  description: Duration in seconds after which the session will automatically end. Defaults to the Project's `defaultTimeout`. Minimum 60 seconds, maximum 21600 seconds (6 hours).
                  type: integer
                  maximum: 21600
                  minimum: 60
                  x-stainless-param: api_timeout
                keepAlive:
                  description: Set to true to keep the session alive even after disconnections. Available on the Hobby Plan and above.
                  type: boolean
                proxies:
                  description: Proxy configuration. Can be true for default proxy, or an array of proxy configurations.
                  anyOf:
                  - type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/BrowserbaseProxyConfig'
                      - $ref: '#/components/schemas/ExternalProxyConfig'
                      - $ref: '#/components/schemas/NoneProxyConfig'
                  - type: boolean
                proxySettings:
                  description: Supplementary proxy settings. Optional.
                  type: object
                  properties:
                    caCertificates:
                      description: The TLS certificate IDs to trust. Optional.
                      type: array
                      items:
                        format: uuid
                        type: string
                      default: []
                region:
                  description: The region where the Session should run.
                  type: string
                  default: us-west-2
                  enum:
                  - us-west-2
                  - us-east-1
                  - eu-central-1
                  - ap-southeast-1
                userMetadata:
                  description: Arbitrary user metadata to attach to the session. To learn more about user metadata, see [User Metadata](/features/sessions#user-metadata).
                  type: object
                  additionalProperties: true
                  properties: {}
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Session'
                - type: object
                  properties:
                    connectUrl:
                      description: WebSocket URL to connect to the Session.
                      type: string
                      format: uri
                    seleniumRemoteUrl:
                      description: HTTP URL to connect to the Session.
                      type: string
                      format: uri
                    signingKey:
                      description: Signing key to use when connecting to the Session via HTTP.
                      type: string
                  required:
                  - connectUrl
                  - seleniumRemoteUrl
                  - signingKey
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n  --url https://api.browserbase.com/v1/sessions \\\n  --header 'Content-Type: application/json' \\\n  --header 'X-BB-API-Key: <api-key>' \\\n  --data '{}'"
      - lang: JavaScript
        source: "fetch('https://api.browserbase.com/v1/sessions', {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    'X-BB-API-Key': '<api-key>'\n  },\n  body: JSON.stringify({})\n})"
      - lang: Python
        source: "import requests\nurl = \"https://api.browserbase.com/v1/sessions\"\npayload = {}\nheaders = {\n\n\n\n\n\n\n    \"X-BB-API-Key\": \"<api-key>\",\n    \"Content-Type\": \"application/json\"\n}\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\nprint(response.text)"
      - lang: PHP
        source: "<?php\n$curl = curl_init();\ncurl_setopt_array($curl, [\n  CURLOPT_URL => \"https://api.browserbase.com/v1/sessions\",\n  CURLOPT_RETURNTRANSFER => true,\n  CURLOPT_ENCODING => \"\",\n  CURLOPT_MAXREDIRS => 10,\n  CURLOPT_TIMEOUT => 30,\n  CURLOPT_HTTP_VERSION => CURL_HTTP_VERSION_1_1,\n  CURLOPT_CUSTOMREQUEST => \"POST\",\n  CURLOPT_POSTFIELDS => \"{}\",\n  CURLOPT_HTTPHEADER => [\n    \"Content-Type: application/json\",\n    \"X-BB-API-Key: <api-key>\"\n  ],\n]);\n$response = curl_exec($curl);\n$err = curl_error($curl);\ncurl_close($curl);\nif ($err) {\n  echo \"cURL Error #:\" . $err;\n} else {\n  echo $response;\n}"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io/ioutil\"\n)\n\nfunc main() {\n\n\turl := \"https://api.browserbase.com/v1/sessions\"\n\n\tpayload := strings.NewReader(\"{}\")\n\n\treq, _ := http.NewRequest(\"POST\", url, payload)\n\n\treq.Header.Add(\"X-BB-API-Key\", \"<api-key>\")\n\treq.Header.Add(\"Content-Type\", \"application/json\")\n\n\tres, _ := http.DefaultClient.Do(req)\n\n\tdefer res.Body.Close()\n\tbody, _ := ioutil.ReadAll(res.Body)\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "HttpResponse<String> response = Unirest.post(\"https://api.browserbase.com/v1/sessions\")\n\n\n\n\n\n\n  .header(\"X-BB-API-Key\", \"<api-key>\")\n  .header(\"Content-Type\", \"application/json\")\n  .body(\"{}\")\n  .asString();"
      tags:
      - Sessions
  /v1/sessions/{id}:
    get:
      operationId: Sessions_get
      summary: Get a Session
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Session'
                - type: object
                  properties:
                    connectUrl:
                      description: WebSocket URL to connect to the Session.
                      type: string
                      format: uri
                    seleniumRemoteUrl:
                      description: HTTP URL to connect to the Session.
                      type: string
                      format: uri
                    signingKey:
                      description: Signing key to use when connecting to the Session via HTTP.
                      type: string
      tags:
      - Sessions
    post:
      operationId: Sessions_update
      summary: Update a Session
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  description: Set to `REQUEST_RELEASE` to request that the session complete. Use before session's timeout to avoid additional charges.
                  type: string
                  enum:
                  - REQUEST_RELEASE
              required:
              - status
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
      tags:
      - Sessions
  /v1/sessions/{id}/debug:
    get:
      operationId: Sessions_getDebug
      summary: Session Live URLs
      parameters:
      - name: expiresIn
        in: query
        description: Time-to-live of the generated live view URLs, in seconds. If omitted, the URLs expire with the session, up to a maximum of 21600 seconds (6 hours).
        required: false
        schema:
          type: integer
          maximum: 21600
          minimum: 60
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLiveUrls'
      tags:
      - Sessions
  /v1/sessions/{id}/logs:
    get:
      operationId: Sessions_getLogs
      summary: Session Logs
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionLog'
      tags:
      - Sessions
  /v1/sessions/{id}/recording/downloads:
    post:
      operationId: Sessions_createRecordingDownloads
      summary: Create Session Recording Downloads
      description: Requests one downloadable MP4 per recorded page of a session. Assembly runs asynchronously and every page returns as `PENDING`. Re-posting re-enqueues all pages and retries any that failed. Poll the GET endpoint for per-page status and, on standard (non-BYOS) projects, download URLs.
      parameters:
      - name: id
        in: path
        description: Session ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Downloads enqueued. Poll the GET endpoint for status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloads:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecordingDownload'
                required:
                - downloads
        '404':
          description: The session was not found, or it has no recording.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    description: HTTP status code
                    type: integer
                  error:
                    description: HTTP error name
                    type: string
                  message:
                    description: Human-readable error message
                    type: string
                required:
                - statusCode
                - error
                - message
        '409':
          description: The session has not ended. Recording downloads are available only after a session completes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    description: HTTP status code
                    type: integer
                  error:
                    description: HTTP error name
                    type: string
                  message:
                    description: Human-readable error message
                    type: string
                required:
                - statusCode
                - error
                - message
        '410':
          description: The session's recording has aged out of its retention window and can no longer be assembled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    description: HTTP status code
                    type: integer
                  error:
                    description: HTTP error name
                    type: string
                  message:
                    description: Human-readable error message
                    type: string
                required:
                - statusCode
                - error
                - message
        '422':
          description: 'Recording was disabled for this session (`recordSession: false`), so there is nothing to assemble.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    description: HTTP status code
                    type: integer
                  error:
                    description: HTTP error name
                    type: string
                  message:
                    description: Human-readable error message
                    type: string
                required:
                - statusCode
                - error
                - message
        '502':
          description: Failed to reach the recording service. Retry the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    description: HTTP status code
                    type: integer
                  error:
                    description: HTTP error name
                    type: string
                  message:
                    description: Human-readable error message
                    type: string
                required:
                - statusCode
                - error
                - message
      tags:
      - Sessions
    get:
      operationId: Sessions_listRecordingDownloads
      summary: List Session Recording Downloads
      description: Returns the per-page download status for a session, with a short-lived signed URL for each completed page on standard (non-BYOS) projects.
      parameters:
      - name: id
        in: path
        description: Session ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloads:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecordingDownload'
                required:
                - downloads
        '404':
          description: The session was not found, or it has no recording.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    description: HTTP status code
                    type: integer
                  error:
                    description: HTTP error name
                    type: string
                  message:
                    description: Human-readable error message
                    type: string
                required:
                - statusCode
                - error
                - message
        '409':
          description: The session has not ended. Recording downloads are available only after a session completes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    description: HTTP status code
                    type: integer
                  error:
                    description: HTTP error name
                    type: string
                  message:
                    description: Human-readable error message
                    type: string
                required:
                - statusCode
                - error
                - message
        '410':
          description: The session's recording has aged out of its retention window and can no longer be assembled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    description: HTTP status code
                    type: integer
                  error:
                    description: HTTP error name
                    type: string
                  message:
                    description: Human-readable error message
                    type: string
                required:
                - statusCode
                - error
                - message
        '422':
          description: 'Recording was disabled for this session (`recordSession: false`), so there is nothing to download.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    description: HTTP status code
                    type: integer
                  error:
                    description: HTTP error name
                    type: string
                  message:
                    description: Human-readable error message
                    type: string
                required:
                - statusCode
                - error
                - message
        '502':
          description: Failed to reach the recording service. Retry the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    description: HTTP status code
                    type: integer
                  error:
                    description: HTTP error name
                    type: string
                  message:
                    description: Human-readable error message
                    type: string
                required:
                - statusCode
                - error
                - message
      tags:
      - Sessions
  /v1/sessions/{id}/replays:
    get:
      operationId: Sessions_getReplay
      summary: Get Session Replay
      description: Returns page metadata for a session replay, including timing information and the URL of each page's HLS playlist.
      parameters:
      - name: id
        in: path
        description: Session ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReplayPage'
                  pageCount:
                    type: integer
                required:
                - pages
                - pageCount
      tags:
      - Sessions
  /v1/sessions/{id}/replays/{pageId}:
    get:
      operationId: Sessions_getReplayPage
      summary: Get Replay Page
      description: Returns an HLS VOD media playlist (.m3u8) for a specific page of a session replay.
      parameters:
      - name: id
        in: path
        description: Session ID
        required: true
        schema:
          type: string
          format: uuid
      - name: pageId
        in: path
        required: true
        schema:
          type: string
          maxLength: 3
          pattern: ^\d+$
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
      tags:
      - Sessions
  /v1/sessions/{id}/uploads:
    post:
      operationId: Sessions_uploadFile
      summary: Create Session Uploads
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
      tags:
      - Sessions
components:
  schemas:
    SessionLog:
      type: object
      properties:
        method:
          type: string
        pageId:
          type: integer
        sessionId:
          type: string
        request:
          type: object
          properties:
            timestamp:
              description: milliseconds that have elapsed since the UNIX epoch
              type: integer
            params:
              type: object
              additionalProperties: true
              properties: {}
            rawBody:
              type: string
          required:
          - params
          - rawBody
        response:
          type: object
          properties:
            timestamp:
              description: milliseconds that have elapsed since the UNIX epoch
              type: integer
            result:
              type: object
              additionalProperties: true
              properties: {}
            rawBody:
              type: string
          required:
          - result
          - rawBody
        timestamp:
          description: milliseconds that have elapsed since the UNIX epoch
          type: integer
        frameId:
          type: string
        loaderId:
          type: string
      required:
      - method
      - pageId
      - sessionId
    ReplayPage:
      type: object
      properties:
        pageId:
          type: string
        url:
          type: string
        startTimeMs:
          type: integer
        endTimeMs:
          type: integer
      required:
      - pageId
      - url
      - startTimeMs
      - endTimeMs
    NoneProxyConfig:
      type: object
      properties:
        type:
          description: Type of proxy. Always 'none' for this config.
          type: string
          enum:
          - none
        domainPattern:
          description: Domain pattern for which this proxy should be used. If omitted, defaults to all domains. Optional.
          type: string
      required:
      - type
    RecordingDownloadStatus:
      description: 'Per-page MP4 assembly state. `NOT_REQUESTED`: no download has been requested for the session yet. `PENDING`: assembly is enqueued or in progress. `COMPLETED`: the MP4 is ready. `FAILED`: assembly failed; POST again to retry.'
      type: string
      enum:
      - NOT_REQUESTED
      - PENDING
      - COMPLETED
      - FAILED
    ExternalProxyConfig:
      type: object
      properties:
        type:
          description: Type of proxy. Always 'external' for this config.
          type: string
          enum:
          - external
        server:
          description: Server URL for external proxy. Required.
          type: string
        domainPattern:
          description: Domain pattern for which this proxy should be used. If omitted, defaults to all domains. Optional.
          type: string
        username:
          description: Username for external proxy authentication. Optional.
          type: string
        password:
          description: Password for external proxy authentication. Optional.
          type: string
      required:
      - type
      - server
    BrowserbaseProxyConfig:
      type: object
      properties:
        type:
          description: Type of proxy. Always use 'browserbase' for the Browserbase managed proxy network.
          type: string
          enum:
          - browserbase
        geolocation:
          description: Geographic location for the proxy. Optional.
          type: object
          properties:
            city:
              description: Name of the city. Use spaces for multi-word city names. Optional.
              type: string
            state:
              description: US state code (2 characters). Must also specify US as the country. Optional.
              type: string
              maxLength: 2
              minLength: 2
              pattern: ^[A-Za-z]{2}$
            country:
              description: Country code in ISO 3166-1 alpha-2 format
              type: string
              maxLength: 2
              minLength: 2
              pattern: ^[A-Za-z]{2}$
          required:
          - country
        domainPattern:
          description: Domain pattern for which this proxy should be used. If omitted, defaults to all domains. Optional.
          type: string
      required:
      - type
    RecordingDownload:
      type: object
      properties:
        pageId:
          description: Recorded page (tab) within the session, e.g. "0", "1".
          type: string
        status:
          $ref: '#/components/schemas/RecordingDownloadStatus'
        downloadUrl:
          description: Short-lived signed CDN URL, re-minted each GET. Present only when COMPLETED on a standard (non-BYOS) project.
          type: string
        completedAt:
          description: When the MP4 was created. Present only when COMPLETED on a standard (non-BYOS) project.
          type: string
          format: date-time
      required:
      - pageId
      - status
    SessionLiveUrls:
      type: object
      properties:
        debuggerFullscreenUrl:
          type: string
          format: uri
        debuggerUrl:
          type: string
          format: uri
        pages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              url:
                type: string
                format: uri
              faviconUrl:
                type: string
                format: uri
              title:
                type: string
              debuggerUrl:
                type: string
                format: uri
              debuggerFullscreenUrl:
                type: string
                format: uri
            required:
            - id
            - url
            - faviconUrl
            - title
            - debuggerUrl
            - debuggerFullscreenUrl
        wsUrl:
          type: string
          format: uri
      required:
      - debuggerFullscreenUrl
      - debuggerUrl
      - pages
      - wsUrl
    Session:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projectId:
          description: The Project ID linked to the Session.
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - ERROR
          - TIMED_OUT
          - COMPLETED
        proxyBytes:
          description: Bytes used via the [Proxy](/features/stealth-mode#proxies-and-residential-ips)
          type: integer
        keepAlive:
          description: Indicates if the Session was created to be kept alive upon disconnections
          type: boolean
        contextId:
          description: Optional. The Context linked to the Session.
          type: string
        region:
          description: The region where the Session is running.
