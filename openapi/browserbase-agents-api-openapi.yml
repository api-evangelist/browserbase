openapi: 3.2.0
info:
  title: Browserbase Agents API
  description: Browserbase API for 3rd party developers
  version: v1
servers:
- url: https://api.browserbase.com
  description: Public endpoint
  variables: {}
security:
- BrowserbaseAuth: []
tags:
- name: Agents
paths:
  /v1/agents:
    post:
      operationId: Agents_create
      summary: Create an Agent
      description: Create a reusable agent. An agent defines a `systemPrompt` and `resultSchema` that guide its behavior for every run. Only `name` is required; an agent created with no `systemPrompt` behaves like an unconfigured run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Human-readable name for the agent. Used to identify the agent in the dashboard and API responses.
                  type: string
                  maxLength: 255
                  minLength: 1
                systemPrompt:
                  description: System prompt that steers the agent's behavior on every run that uses this agent.
                  type: string
                  minLength: 1
                resultSchema:
                  description: An optional [JSON Schema](https://json-schema.org/specification) object. If provided, runs that reference this agent will aim to return a `result` that conforms to this schema when they complete. Can be overridden per run by passing `resultSchema` on the run request.
                  type: object
                  additionalProperties: true
                  properties: {}
              additionalProperties: false
              required:
              - name
      responses:
        '201':
          description: The agent has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
      x-codeSamples:
      - lang: javascript
        label: Node.js
        source: "import Browserbase from \"@browserbasehq/sdk\";\n\nconst bb = new Browserbase({\n  apiKey: process.env.BROWSERBASE_API_KEY,\n});\n\nconst agent = await bb.agents.create({\n  name: \"Job Finder\",\n  systemPrompt: \"Use official company career pages.\",\n});\n\nconsole.log(agent);"
      - lang: python
        label: Python
        source: "import os\n\nfrom browserbase import Browserbase\n\nbb = Browserbase(api_key=os.environ[\"BROWSERBASE_API_KEY\"])\n\nagent = bb.agents.create(\n    name=\"Job Finder\",\n    system_prompt=\"Use official company career pages.\",\n)\n\nprint(agent)"
      - lang: bash
        label: cURL
        source: "curl --request POST \\\n  --url https://api.browserbase.com/v1/agents \\\n  --header 'Content-Type: application/json' \\\n  --header \"X-BB-API-Key: $BROWSERBASE_API_KEY\" \\\n  --data '{\n    \"name\": \"Job Finder\",\n    \"systemPrompt\": \"Use official company career pages.\"\n  }'"
      tags:
      - Agents
    get:
      operationId: Agents_list
      summary: List Agents
      description: List agents across your account. Supports filtering by creation time.
      parameters:
      - name: startAt
        in: query
        description: Only return agents created on or after this timestamp (inclusive). RFC 3339, e.g. 2026-01-19T00:00:00Z.
        required: false
        schema:
          type: string
          format: date-time
      - name: endAt
        in: query
        description: Only return agents created on or before this timestamp (inclusive). RFC 3339, e.g. 2026-01-20T00:00:00Z.
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Maximum number of results to return.
        required: false
        schema:
          type: integer
          default: 20
          maximum: 1000
          minimum: 1
      - name: cursor
        in: query
        description: Pagination cursor. Pass the nextCursor from the previous response to fetch the next page. Omit to start from the first page.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The page of matching agents.
          content:
            application/json:
              schema:
                description: A page of agents.
                type: object
                properties:
                  data:
                    description: The page of matching agents.
                    type: array
                    items:
                      $ref: '#/components/schemas/Agent'
                  limit:
                    description: The maximum number of results returned in this page.
                    type: integer
                  nextCursor:
                    description: Cursor for the next page. Pass it back as `cursor` on the next request to continue paging. null when there are no more results.
                    anyOf:
                    - type: string
                required:
                - data
                - limit
                - nextCursor
      x-codeSamples:
      - lang: javascript
        label: Node.js
        source: "import Browserbase from \"@browserbasehq/sdk\";\n\nconst bb = new Browserbase({\n  apiKey: process.env.BROWSERBASE_API_KEY,\n});\n\nconst agents = await bb.agents.list({ limit: 20 });\n\nconsole.log(agents);"
      - lang: python
        label: Python
        source: 'import os


          from browserbase import Browserbase


          bb = Browserbase(api_key=os.environ["BROWSERBASE_API_KEY"])

          agents = bb.agents.list(limit=20)


          print(agents)'
      - lang: bash
        label: cURL
        source: "curl --request GET \\\n  --url 'https://api.browserbase.com/v1/agents?limit=20' \\\n  --header \"X-BB-API-Key: $BROWSERBASE_API_KEY\""
      tags:
      - Agents
  /v1/agents/runs:
    post:
      operationId: AgentRuns_create
      summary: Run an Agent
      description: Run a browser agent to complete the `task` by using web search and browser tooling. Optionally pass `agentId` to run a custom agent you've created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  description: Optionally run a specific [custom agent](/reference/api/create-an-agent) you've created by ID. The run will use the agent's `systemPrompt` and `resultSchema` unless overridden.
                  type: string
                task:
                  description: A natural language description of the task the agent should accomplish.
                  type: string
                  minLength: 1
                resultSchema:
                  description: An optional [JSON Schema](https://json-schema.org/specification) object. If provided, the agent will aim to return a `result` that conforms to this schema when the run completes. Overrides the referenced agent's default `resultSchema` for this run only.
                  type: object
                  additionalProperties: true
                  properties: {}
                browserSettings:
                  description: Browser configuration for the agent's session. When omitted, runner defaults apply.
                  type: object
                  additionalProperties: false
                  properties:
                    context:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          description: The Context ID.
                          type: string
                        persist:
                          description: Whether to persist the context after browsing. Defaults to false.
                          type: boolean
                      required:
                      - id
                    proxies:
                      description: Proxy configuration. Can be true for default proxy, or an array of proxy configurations.
                      anyOf:
                      - type: array
                        items:
                          anyOf:
                          - $ref: '#/components/schemas/BrowserbaseProxyConfig'
                          - $ref: '#/components/schemas/ExternalProxyConfig'
                          - $ref: '#/components/schemas/NoneProxyConfig'
                      - type: boolean
                    verified:
                      description: Set true to enable Browserbase Verified for the session.
                      type: boolean
                variables:
                  description: Optional named variables the agent can reference as placeholders, i.e. `%variable%`. Each entry pairs a `value` the placeholder resolves to with an optional `description` that hints to the agent when it should be used. Values are not persisted.
                  type: object
                  additionalProperties:
                    additionalProperties: false
                    type: object
                    properties:
                      value:
                        description: The value the placeholder resolves to when the agent uses it.
                        type: string
                      description:
                        description: Optional hint to the agent describing what this variable represents and when to use it.
                        type: string
                    required:
                    - value
                pauseWhen:
                  description: Optional description of when the agent should pause and wait for input from your application (e.g. a verification code, an approval, or an answer from another system). When set, the agent is given a `pause` tool; calling it transitions the run to `PAUSED` (the agent's request is the trailing `pause` tool call in the run's messages) until it is resumed via the resume endpoint.
                  type: string
                  minLength: 1
              additionalProperties: false
              required:
              - task
      responses:
        '201':
          description: The agent run has been created in `pending` state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
      x-codeSamples:
      - lang: javascript
        label: Node.js
        source: "import Browserbase from \"@browserbasehq/sdk\";\n\nconst bb = new Browserbase({\n  apiKey: process.env.BROWSERBASE_API_KEY,\n});\n\nconst run = await bb.agents.runs.create({\n  agentId: \"agent-id\",\n  task: \"Find the pricing page on example.com.\",\n});\n\nconsole.log(run);"
      - lang: python
        label: Python
        source: "import os\n\nfrom browserbase import Browserbase\n\nbb = Browserbase(api_key=os.environ[\"BROWSERBASE_API_KEY\"])\n\nrun = bb.agents.runs.create(\n    agent_id=\"agent-id\",\n    task=\"Find the pricing page on example.com.\",\n)\n\nprint(run)"
      - lang: bash
        label: cURL
        source: "curl --request POST \\\n  --url https://api.browserbase.com/v1/agents/runs \\\n  --header 'Content-Type: application/json' \\\n  --header \"X-BB-API-Key: $BROWSERBASE_API_KEY\" \\\n  --data '{\n    \"agentId\": \"agent-id\",\n    \"task\": \"Find the pricing page on example.com.\"\n  }'"
      tags:
      - Agents
    get:
      operationId: AgentRuns_list
      summary: List Runs
      description: List runs across your account. Supports filtering by status, by the agent they reference, and by creation time.
      parameters:
      - name: status
        in: query
        description: 'Current status of the run.

          - `PENDING` - agent will run soon

          - `RUNNING` - agent is currently running

          - `COMPLETED` - agent has finished running

          - `FAILED` - agent has failed the run

          - `STOPPED` - run was stopped by the user

          - `TIMED_OUT` - run exceeded maximum time

          - `PAUSED` - run is paused awaiting input from the caller; the agent''s request is the trailing `pause` tool call in the run''s messages'
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - RUNNING
          - COMPLETED
          - FAILED
          - STOPPED
          - TIMED_OUT
          - PAUSED
      - name: agentId
        in: query
        description: Only return runs that reference this agent ID.
        required: false
        schema:
          type: string
      - name: startAt
        in: query
        description: Only return runs created on or after this timestamp (inclusive). RFC 3339, e.g. 2026-01-19T00:00:00Z.
        required: false
        schema:
          type: string
          format: date-time
      - name: endAt
        in: query
        description: Only return runs created on or before this timestamp (inclusive). RFC 3339, e.g. 2026-01-20T00:00:00Z.
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Maximum number of results to return.
        required: false
        schema:
          type: integer
          default: 20
          maximum: 1000
          minimum: 1
      - name: cursor
        in: query
        description: Pagination cursor. Pass the nextCursor from the previous response to fetch the next page. Omit to start from the first page.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The page of matching agent runs.
          content:
            application/json:
              schema:
                description: A page of agent runs.
                type: object
                properties:
                  data:
                    description: The page of matching agent runs.
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentRun'
                  limit:
                    description: The maximum number of results returned in this page.
                    type: integer
                  nextCursor:
                    description: Cursor for the next page. Pass it back as `cursor` on the next request to continue paging. null when there are no more results.
                    anyOf:
                    - type: string
                required:
                - data
                - limit
                - nextCursor
      x-codeSamples:
      - lang: javascript
        label: Node.js
        source: "import Browserbase from \"@browserbasehq/sdk\";\n\nconst bb = new Browserbase({\n  apiKey: process.env.BROWSERBASE_API_KEY,\n});\n\nconst runs = await bb.agents.runs.list({\n  status: \"COMPLETED\",\n  limit: 20,\n});\n\nconsole.log(runs);"
      - lang: python
        label: Python
        source: 'import os


          from browserbase import Browserbase


          bb = Browserbase(api_key=os.environ["BROWSERBASE_API_KEY"])

          runs = bb.agents.runs.list(status="COMPLETED", limit=20)


          print(runs)'
      - lang: bash
        label: cURL
        source: "curl --request GET \\\n  --url https://api.browserbase.com/v1/agents/runs \\\n  --get \\\n  --data-urlencode 'status=COMPLETED' \\\n  --data-urlencode 'limit=20' \\\n  --header \"X-BB-API-Key: $BROWSERBASE_API_KEY\""
      tags:
      - Agents
  /v1/agents/runs/{runId}:
    get:
      operationId: AgentRuns_get
      summary: Get a Run
      description: Retrieve the current status and details of a run, including its result and associated session information. To fetch the run's messages, use List Run Messages.
      parameters:
      - name: runId
        in: path
        description: The run ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The agent run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
      x-codeSamples:
      - lang: javascript
        label: Node.js
        source: "import Browserbase from \"@browserbasehq/sdk\";\n\nconst bb = new Browserbase({\n  apiKey: process.env.BROWSERBASE_API_KEY,\n});\n\nconst run = await bb.agents.runs.retrieve(\"run-id\");\n\nconsole.log(run);"
      - lang: python
        label: Python
        source: 'import os


          from browserbase import Browserbase


          bb = Browserbase(api_key=os.environ["BROWSERBASE_API_KEY"])

          run = bb.agents.runs.retrieve("run-id")


          print(run)'
      - lang: bash
        label: cURL
        source: "curl --request GET \\\n  --url https://api.browserbase.com/v1/agents/runs/run-id \\\n  --header \"X-BB-API-Key: $BROWSERBASE_API_KEY\""
      tags:
      - Agents
  /v1/agents/runs/{runId}/messages:
    get:
      operationId: AgentRuns_messages
      summary: List Run Messages
      description: 'Returns a paginated list of messages produced by a run, in chronological order, with the oldest messages first.


        Messages conform to the AI SDK UIMessage format.'
      parameters:
      - name: since
        in: query
        description: The `id` of the last message you've already received. The response will contain messages produced after that one, in chronological order. Omit on the first call. Pass the previous response's `nextSince` value to continue paging or to poll for new messages.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of messages to return.
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      - name: all
        in: query
        description: Return every message after `since` in one response, ignoring `limit`.
        required: false
        schema:
          type: boolean
          default: false
      - name: runId
        in: path
        description: The run ID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The page of messages, in chronological order, with the oldest messages first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: The page of messages, in chronological order, with the oldest messages first.
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - createdAt
                      - message
                      properties:
                        id:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        message:
                          description: An AI SDK response message (assistant or tool).
                          type: object
                          additionalProperties: true
                          properties:
                            role:
                              type: string
                              enum:
                              - assistant
                              - tool
                            content:
                              description: Plain string (assistant text) or an array of typed parts.
                              oneOf:
                              - type: string
                              - type: array
                                items:
                                  type: object
                                  required:
                                  - type
                                  additionalProperties: true
                                  properties:
                                    type:
                                      description: text | reasoning | file | tool-call | tool-result
                                      type: string
                                    text:
                                      type: string
                                    toolCallId:
                                      type: string
                                    toolName:
                                      type: string
                                    input: {}
                                    output: {}
                                    mediaType:
                                      type: string
                                    data:
                                      type: string
                          required:
                          - role
                          - content
                  nextSince:
                    description: The `id` of the last message in `data`. Pass it back as `since` on the next request to continue paging, or to poll for new messages. `null` only when the run has no messages yet; in that case, omit `since` and retry.
                    type:
                    - string
                    - 'null'
                required:
                - data
                - nextSince
      x-codeSamples:
      - lang: javascript
        label: Node.js
        source: "import Browserbase from \"@browserbasehq/sdk\";\n\nconst bb = new Browserbase({\n  apiKey: process.env.BROWSERBASE_API_KEY,\n});\n\nconst messages = await bb.agents.runs.listMessages(\"run-id\", {\n  limit: 20,\n});\n\nconsole.log(messages);"
      - lang: python
        label: Python
        source: 'import os


          from browserbase import Browserbase


          bb = Browserbase(api_key=os.environ["BROWSERBASE_API_KEY"])

          messages = bb.agents.runs.list_messages("run-id", limit=20)


          print(messages)'
      - lang: bash
        label: cURL
        source: "curl --request GET \\\n  --url https://api.browserbase.com/v1/agents/runs/run-id/messages \\\n  --get \\\n  --data-urlencode 'limit=20' \\\n  --header \"X-BB-API-Key: $BROWSERBASE_API_KEY\""
      tags:
      - Agents
  /v1/agents/runs/{runId}/resume:
    post:
      operationId: AgentRuns_resume
      summary: Resume a Run
      description: Resume a `PAUSED` run with additional input. The reply in `task` is delivered to the agent as the answer to its pause request (the trailing `pause` tool call in the run's messages), and `variables` merge over the run's original variables. Resuming a run that is not paused returns a conflict.
      parameters:
      - name: runId
        in: path
        description: The run ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  description: 'Additional input for the agent: the reply to its request for input, which is the trailing `pause` tool call in the run''s messages (e.g. an answer or an approval). Delivered to the agent as the result of that pause call.'
                  type: string
                  minLength: 1
                variables:
                  description: Optional named variables the agent can reference as placeholders, i.e. `%variable%`. Each entry pairs a `value` the placeholder resolves to with an optional `description` that hints to the agent when it should be used. Values are not persisted.
                  type: object
                  additionalProperties:
                    additionalProperties: false
                    type: object
                    properties:
                      value:
                        description: The value the placeholder resolves to when the agent uses it.
                        type: string
                      description:
                        description: Optional hint to the agent describing what this variable represents and when to use it.
                        type: string
                    required:
                    - value
              additionalProperties: false
      responses:
        '202':
          description: The resume has been accepted and the run is `RUNNING` again. Poll the run for its next state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
      x-codeSamples:
      - lang: bash
        label: cURL
        source: "curl --request POST \\\n  --url https://api.browserbase.com/v1/agents/runs/run-id/resume \\\n  --header 'Content-Type: application/json' \\\n  --header \"X-BB-API-Key: $BROWSERBASE_API_KEY\" \\\n  --data '{\n    \"task\": \"The code is %code%\",\n    \"variables\": { \"code\": { \"value\": \"123456\" } }\n  }'"
      tags:
      - Agents
  /v1/agents/runs/{runId}/stop:
    post:
      operationId: AgentRuns_stop
      summary: Stop a Run
      description: Request that an in-progress run stop. The run winds down and transitions to `STOPPED`. Stopping a run that has already finished returns a conflict.
      parameters:
      - name: runId
        in: path
        description: The run ID.
        required: true
        schema:
          type: string
      responses:
        '202':
          description: The stop has been requested. Poll the run until its status is `STOPPED` to confirm it wound down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
      x-codeSamples:
      - lang: bash
        label: cURL
        source: "curl --request POST \\\n  --url https://api.browserbase.com/v1/agents/runs/run-id/stop \\\n  --header \"X-BB-API-Key: $BROWSERBASE_API_KEY\""
      tags:
      - Agents
  /v1/agents/{agentId}:
    get:
      operationId: Agents_get
      summary: Get an Agent
      description: Retrieve an agent by ID.
      parameters:
      - name: agentId
        in: path
        description: The agent ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
      x-codeSamples:
      - lang: javascript
        label: Node.js
        source: "import Browserbase from \"@browserbasehq/sdk\";\n\nconst bb = new Browserbase({\n  apiKey: process.env.BROWSERBASE_API_KEY,\n});\n\nconst agent = await bb.agents.retrieve(\"agent-id\");\n\nconsole.log(agent);"
      - lang: python
        label: Python
        source: 'import os


          from browserbase import Browserbase


          bb = Browserbase(api_key=os.environ["BROWSERBASE_API_KEY"])

          agent = bb.agents.retrieve("agent-id")


          print(agent)'
      - lang: bash
        label: cURL
        source: "curl --request GET \\\n  --url https://api.browserbase.com/v1/agents/agent-id \\\n  --header \"X-BB-API-Key: $BROWSERBASE_API_KEY\""
      tags:
      - Agents
    patch:
      operationId: Agents_update
      summary: Update an Agent
      description: Update an existing agent. Only the fields provided in the body are modified; omitted fields are left unchanged.
      parameters:
      - name: agentId
        in: path
        description: The agent ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Human-readable name for the agent. Used to identify the agent in the dashboard and API responses.
                  type: string
                  maxLength: 255
                  minLength: 1
                systemPrompt:
                  description: New system prompt that steers the agent's behavior on every run that uses this agent.
                  type: string
                  minLength: 1
                resultSchema:
                  description: An optional [JSON Schema](https://json-schema.org/specification) object. If provided, runs that reference this agent will aim to return a `result` that conforms to this schema when they complete. Can be overridden per run by passing `resultSchema` on the run request.
                  type: object
                  additionalProperties: true
                  properties: {}
              additionalProperties: false
      responses:
        '200':
          description: The updated agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
      x-codeSamples:
      - lang: javascript
        label: Node.js
        source: "import Browserbase from \"@browserbasehq/sdk\";\n\nconst bb = new Browserbase({\n  apiKey: process.env.BROWSERBASE_API_KEY,\n});\n\nconst agent = await bb.agents.update(\"agent-id\", {\n  name: \"Official Job Finder\",\n});\n\nconsole.log(agent);"
      - lang: python
        label: Python
        source: 'import os


          from browserbase import Browserbase


          bb = Browserbase(api_key=os.environ["BROWSERBASE_API_KEY"])

          agent = bb.agents.update("agent-id", name="Official Job Finder")


          print(agent)'
      - lang: bash
        label: cURL
        source: "curl --request PATCH \\\n  --url https://api.browserbase.com/v1/agents/agent-id \\\n  --header 'Content-Type: application/json' \\\n  --header \"X-BB-API-Key: $BROWSERBASE_API_KEY\" \\\n  --data '{\"name\":\"Official Job Finder\"}'"
      tags:
      - Agents
    delete:
      operationId: Agents_delete
      summary: Delete an Agent
      description: Delete an agent. Runs that already referenced this agent are unaffected.
      parameters:
      - name: agentId
        in: path
        description: The agent ID.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 'The agent has been deleted. Idempotent: deleting an already-deleted or non-existent agent returns 204.'
      x-codeSamples:
      - lang: javascript
        label: Node.js
        source: "import Browserbase from \"@browserbasehq/sdk\";\n\nconst bb = new Browserbase({\n  apiKey: process.env.BROWSERBASE_API_KEY,\n});\n\nawait bb.agents.delete(\"agent-id\");"
      - lang: python
        label: Python
        source: 'import os


          from browserbase import Browserbase


          bb = Browserbase(api_key=os.environ["BROWSERBASE_API_KEY"])

          bb.agents.delete("agent-id")'
      - lang: bash
        label: cURL
